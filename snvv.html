<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>🎂 Chúc Mừng Sinh Nhật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    overflow: hidden;
    background: #07001a;
    color: #fff;
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    cursor: crosshair;
  }

  /* ================= AURORA BACKGROUND ================= */
  .bg{
    position: fixed; inset: -25%; z-index: 0;
    background:
      radial-gradient(circle at 25% 30%, #ff2d95 0%, transparent 42%),
      radial-gradient(circle at 78% 22%, #7b2cff 0%, transparent 42%),
      radial-gradient(circle at 50% 88%, #00d4ff 0%, transparent 42%),
      radial-gradient(circle at 88% 72%, #ff9f1c 0%, transparent 38%),
      radial-gradient(circle at 12% 80%, #00ffa3 0%, transparent 38%);
    filter: blur(70px) saturate(150%);
    opacity: .5;
    animation: aurora 22s ease-in-out infinite alternate;
  }
  @keyframes aurora{
    0%  { transform: translate3d(0,0,0) scale(1) rotate(0deg); }
    50% { transform: translate3d(-4%,3%,0) scale(1.18) rotate(7deg); }
    100%{ transform: translate3d(4%,-3%,0) scale(1.05) rotate(-7deg); }
  }

  /* ================= STARS ================= */
  #stars{ position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .star{
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff, 0 0 16px #9ad8ff;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity: .12; transform: scale(.5); }
    50%     { opacity: 1;   transform: scale(1.35); }
  }

  /* ================= BALLOONS ================= */
  #balloons{ position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .balloon{
    position: absolute;
    bottom: -200px;
    width: 58px; height: 72px;
    border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.85), transparent 42%),
      var(--c);
    box-shadow: inset -8px -10px 22px rgba(0,0,0,.25), 0 0 26px var(--c);
    animation: rise linear infinite;
    will-change: transform;
  }
  .balloon::after{
    content: '';
    position: absolute;
    left: 50%; bottom: -9px;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid var(--c);
  }
  .balloon::before{
    content: '';
    position: absolute;
    left: 50%; bottom: -46px;
    width: 1.5px; height: 40px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, rgba(255,255,255,.7), transparent);
  }
  @keyframes rise{
    0%   { transform: translate(0, 0) scale(var(--s)) rotate(-4deg); }
    50%  { transform: translate(var(--sway), -58vh) scale(var(--s)) rotate(4deg); }
    100% { transform: translate(0, -125vh) scale(var(--s)) rotate(-4deg); }
  }

  /* ================= CANVAS FX ================= */
  #fx{ position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  /* ================= STAGE ================= */
  .stage{
    position: relative; z-index: 3;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(4px, 1.1vh, 14px);
    padding: 16px;
    text-align: center;
    perspective: 1000px;
    pointer-events: none;
  }
  .stage > *{ pointer-events: auto; }

  /* ================= TITLE ================= */
  .title{
    margin: 0;
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 8.2vw, 6.5rem);
    line-height: 1.05;
    letter-spacing: .01em;
    display: flex; flex-wrap: wrap;
    justify-content: center;
    gap: 0 .26em;
    transform-style: preserve-3d;
    transition: transform .35s ease-out;
  }
  .word{ display: inline-flex; }
  .char{
    display: inline-block;
    background-image: linear-gradient(180deg, var(--c1), var(--c2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px var(--c1)) drop-shadow(0 0 34px var(--c2));
    animation: bob 2.6s ease-in-out infinite;
    animation-delay: calc(var(--i) * .07s);
    transform-origin: 50% 100%;
    will-change: transform;
  }
  @keyframes bob{
    0%, 100%{ transform: translateY(0) rotate(0deg) scale(1); }
    50%     { transform: translateY(-14px) rotate(-3.5deg) scale(1.07); }
  }

  /* ================= SUBTITLE ================= */
  .sub{
    margin: 0;
    font-weight: 300;
    font-size: clamp(.8rem, 2.1vw, 1.15rem);
    line-height: 1.55;
    color: #ffe6f2;
    max-width: min(760px, 90vw);
    min-height: 2.8em;
    text-shadow: 0 0 20px rgba(255,110,196,.85);
  }
  .cursor{
    display: inline-block;
    margin-left: 2px;
    color: #ffd93d;
    animation: blink .8s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  /* ================= CAKE ================= */
  .cake-wrap{
    width: 240px; height: 180px;
    margin-top: 4px;
    transition: transform .3s;
  }
  .cake{
    position: relative;
    width: 100%; height: 100%;
    animation: cakeFloat 4.5s ease-in-out infinite;
    filter: drop-shadow(0 22px 34px rgba(0,0,0,.6));
  }
  @keyframes cakeFloat{
    0%, 100%{ transform: translateY(0) rotate(-1deg); }
    50%     { transform: translateY(-12px) rotate(1deg); }
  }

  .plate{
    position: absolute; left: 0; bottom: 0;
    width: 240px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,.04));
    box-shadow: 0 0 32px rgba(120,200,255,.55);
  }

  .layer{
    position: absolute;
    border-radius: 10px;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.35);
  }
  .layer.bottom{
    left: 25px; bottom: 12px;
    width: 190px; height: 64px;
    background: linear-gradient(180deg, #ff8fc0, #d63b7c);
  }
  .layer.top{
    left: 55px; bottom: 76px;
    width: 130px; height: 54px;
    background: linear-gradient(180deg, #b98cff, #7c3aed);
  }
  /* frosting drips */
  .layer::after{
    content: '';
    position: absolute;
    left: -3px; right: -3px;
    top: -10px; height: 26px;
    background-image:
      radial-gradient(circle at 11px 10px, #fff2f8 10.5px, transparent 11px),
      linear-gradient(#fff2f8, #ffe0ee);
    background-size: 22px 26px, 100% 12px;
    background-repeat: repeat-x, no-repeat;
    border-radius: 10px 10px 0 0;
  }
  /* sprinkles */
  .layer::before{
    content: '';
    position: absolute;
    inset: 16px 12px 10px;
    border-radius: 6px;
    background-image:
      radial-gradient(circle, #ffd93d 2px, transparent 2.6px),
      radial-gradient(circle, #4adede 2px, transparent 2.6px),
      radial-gradient(circle, #fff 1.6px, transparent 2.2px);
    background-size: 30px 24px, 40px 32px, 22px 18px;
    background-position: 0 0, 14px 10px, 6px 4px;
    opacity: .85;
  }

  .candle{
    position: absolute;
    bottom: 122px;
    width: 14px; height: 38px;
    border-radius: 4px;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #ff5c8a 6px 12px);
    box-shadow: 0 0 14px rgba(255,180,220,.7);
  }
  .candle.c1{ left: 78px; }
  .candle.c2{ left: 113px; }
  .candle.c3{ left: 148px; }

  .flame{
    position: absolute;
    left: 50%; top: -21px;
    width: 15px; height: 22px;
    border-radius: 50% 50% 50% 50% / 72% 72% 28% 28%;
    background: radial-gradient(ellipse at 50% 76%, #fff 0%, #ffe066 32%, #ff9d00 64%, #ff3d00 100%);
    box-shadow: 0 0 24px 7px rgba(255,160,0,.7), 0 0 70px 20px rgba(255,80,0,.3);
    animation: flicker .16s infinite alternate;
    transform: translateX(-50%);
  }
  @keyframes flicker{
    from{ transform: translateX(-50%) scale(1,1) rotate(-4deg); }
    to  { transform: translateX(-50%) scale(.88,1.14) rotate(4deg); }
  }

  /* ================= BUTTON ================= */
  .btn{
    margin-top: 6px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: clamp(.85rem, 2vw, 1.05rem);
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #2b0033;
    background: linear-gradient(135deg, #ffd93d, #ff8fc0 45%, #8b5cf6 100%);
    background-size: 220% 220%;
    box-shadow: 0 12px 34px rgba(255,90,170,.5), inset 0 0 0 2px rgba(255,255,255,.3);
    animation: btnPulse 2.4s ease-in-out infinite, btnShift 7s linear infinite;
    transition: transform .2s ease;
  }
  .btn:hover{ transform: translateY(-3px) scale(1.06); }
  .btn:active{ transform: scale(.95); }
  @keyframes btnPulse{
    0%, 100%{ box-shadow: 0 12px 34px rgba(255,90,170,.5), inset 0 0 0 2px rgba(255,255,255,.3); }
    50%     { box-shadow: 0 12px 50px rgba(255,200,60,.85), inset 0 0 0 2px rgba(255,255,255,.5); }
  }
  @keyframes btnShift{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 200% 50%; }
  }

  /* ================= WISH ================= */
  .wish{
    max-width: min(700px, 92vw);
    font-size: clamp(.78rem, 1.9vw, 1rem);
    line-height: 1.65;
    font-weight: 300;
    color: #fff;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 46px rgba(255,110,196,.4);
    opacity: 0;
    max-height: 0;
    padding: 0 22px;
    overflow: hidden;
    transform: translateY(18px) scale(.92);
    transition: all .75s cubic-bezier(.2,1.35,.4,1);
  }
  .wish.show{
    opacity: 1;
    max-height: 320px;
    padding: 14px 22px;
    transform: translateY(0) scale(1);
  }

  @media (max-height: 720px){
    .cake-wrap{ transform: scale(.72); margin: -22px 0; }
  }
  @media (max-width: 420px){
    .cake-wrap{ transform: scale(.82); margin: -14px 0; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div id="stars"></div>
  <div id="balloons"></div>
  <canvas id="fx"></canvas>

  <main class="stage">
    <h1 class="title" id="title" aria-label="Chúc mừng sinh nhật"></h1>
    <p class="sub" id="sub"></p>

    <div class="cake-wrap">
      <div class="cake">
        <div class="plate"></div>
        <div class="layer bottom"></div>
        <div class="layer top"></div>
        <div class="candle c1"><i class="flame"></i></div>
        <div class="candle c2"><i class="flame"></i></div>
        <div class="candle c3"><i class="flame"></i></div>
      </div>
    </div>

    <button class="btn" id="btn">🎁 Bấm vào đây 🎁</button>
    <div class="wish" id="wish">
      🎂 <strong>Món quà dành cho bạn:</strong> một tuổi mới thật rực rỡ, nhiều sức khỏe,
      thành công và ngập tràn yêu thương. Mong mọi điều ước của bạn đều thành sự thật! 💖
    </div>
  </main>

<script>
/* =========================================================
   1. STARS
   ========================================================= */
(function makeStars(){
  const box = document.getElementById('stars');
  const n = window.innerWidth < 700 ? 55 : 110;
  let html = '';
  for (let i = 0; i < n; i++){
    const size = (Math.random() * 2 + 1).toFixed(1);
    html += `<div class="star" style="
      left:${(Math.random()*100).toFixed(2)}%;
      top:${(Math.random()*100).toFixed(2)}%;
      width:${size}px;height:${size}px;
      animation-duration:${(2 + Math.random()*3.5).toFixed(2)}s;
      animation-delay:${(Math.random()*4).toFixed(2)}s;"></div>`;
  }
  box.innerHTML = html;
})();

/* =========================================================
   2. BALLOONS
   ========================================================= */
(function makeBalloons(){
  const box = document.getElementById('balloons');
  const colors = ['#ff4d8d','#ffd93d','#4adede','#8b5cf6','#ff8c42','#4ade80','#f472b6'];
  const n = window.innerWidth < 700 ? 9 : 16;
  for (let i = 0; i < n; i++){
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.setProperty('--c', colors[(Math.random()*colors.length)|0]);
    b.style.setProperty('--s', (0.55 + Math.random()*0.8).toFixed(2));
    b.style.setProperty('--sway', (Math.random()*70 - 35).toFixed(0) + 'px');
    b.style.left = (Math.random()*96).toFixed(2) + 'vw';
    const dur = 9 + Math.random()*9;
    b.style.animationDuration = dur.toFixed(2) + 's';
    b.style.animationDelay = (-Math.random()*dur).toFixed(2) + 's';
    box.appendChild(b);
  }
})();

/* =========================================================
   3. TITLE — fromng chữ màu + nhún nhảy
   ========================================================= */
(function buildTitle(){
  const el = document.getElementById('title');
  const TEXT = 'CHÚC MỪNG SINH NHẬT';
  let i = 0;
  TEXT.split(' ').forEach(word => {
    const w = document.createElement('span');
    w.className = 'word';
    [...word].forEach(ch => {
      const s = document.createElement('span');
      s.className = 'char';
      s.textContent = ch;
      const h1 = (i * 26) % 360;
      const h2 = (h1 + 45) % 360;
      s.style.setProperty('--c1', `hsl(${h1} 100% 72%)`);
      s.style.setProperty('--c2', `hsl(${h2} 100% 48%)`);
      s.style.setProperty('--i', i);
      i++;
      w.appendChild(s);
    });
    el.appendChild(w);
  });
})();

/* Nghiêng 3D theo chuột */
(function tilt(){
  const title = document.getElementById('title');
  window.addEventListener('mousemove', e => {
    const rx = (e.clientX / window.innerWidth  - 0.5) * 2;
    const ry = (e.clientY / window.innerHeight - 0.5) * 2;
    title.style.transform = `rotateY(${(rx*7).toFixed(2)}deg) rotateX(${(-ry*7).toFixed(2)}deg)`;
  }, { passive: true });
})();

/* =========================================================
   4. TYPEWRITER
   ========================================================= */
(function typewriter(){
  const el = document.getElementById('sub');
  const MSG = 'Chúc bạn một ngày sinh nhật thật rực rỡ ✨ tràn đầy niềm vui, tiếng cười và những điều bất ngờ tuyệt vời nhất 💖';
  const chars = [...MSG];
  let i = 0;
  function tick(){
    if (i <= chars.length){
      el.innerHTML = chars.slice(0, i).join('') + '<span class="cursor">|</span>';
      i++;
      setTimeout(tick, 45 + Math.random()*55);
    } else {
      el.innerHTML = MSG + '<span class="cursor">|</span>';
    }
  }
  setTimeout(tick, 1300);
})();

/* =========================================================
   5. FIREWORKS ENGINE
   ========================================================= */
const cvs = document.getElementById('fx');
const ctx = cvs.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const IS_MOBILE = window.innerWidth < 720;
let W = 0, H = 0;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
resize();
window.addEventListener('resize', resize);

const rockets  = [];
const sparks   = [];
const confetti = [];
const MAX_SPARKS = IS_MOBILE ? 800 : 1400;
const MAX_CONF   = IS_MOBILE ? 260 : 450;

/* ---------- Rocket ---------- */
function launchRocket(x, targetY){
  rockets.push({
    x: x != null ? x : W * (0.12 + Math.random() * 0.76),
    y: H + 20,
    ty: targetY != null ? targetY : H * (0.10 + Math.random() * 0.38),
    vx: (Math.random() - 0.5) * 1.4,
    vy: -(9 + Math.random() * 4.5),
    hue: Math.random() * 360,
    trail: []
  });
}

/* ---------- Explosion ---------- */
function explode(x, y, hue){
  const n = (IS_MOBILE ? 55 : 85) + Math.floor(Math.random() * (IS_MOBILE ? 40 : 65));
  const power = 3.6 + Math.random() * 3.4;
  const mono = Math.random() < 0.35;

  for (let i = 0; i < n; i++){
    if (sparks.length > MAX_SPARKS) sparks.shift();
    const a  = Math.random() * Math.PI * 2;
    const sp = Math.pow(Math.random(), 0.6) * power;
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      hue: mono ? hue + (Math.random() * 26 - 13) : hue + (Math.random() * 90 - 45),
      life: 1,
      decay: 0.006 + Math.random() * 0.013,
      size: 1.1 + Math.random() * 1.9
    });
  }
}

/* ---------- Confetti ---------- */
const CONF_COLORS = ['#ff4d8d','#ffd93d','#4adede','#8b5cf6','#4ade80','#ff9f1c','#ffffff','#f472b6'];
function burstConfetti(x, y, n){
  for (let i = 0; i < n; i++){
    if (confetti.length > MAX_CONF) confetti.shift();
    const a  = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 9;
    confetti.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.42,
      w: 5 + Math.random() * 7,
      h: 8 + Math.random() * 10,
      color: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0],
      sway: Math.random() * Math.PI * 2
    });
  }
}

/* ---------- Updates ---------- */
function updateRockets(dt){
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.vy += 0.15 * dt;
    r.trail.push({ x: r.x, y: r.y });
    if (r.trail.length > 9) r.trail.shift();

    if (r.y <= r.ty || r.vy >= 0){
      explode(r.x, r.y, r.hue);
      rockets.splice(i, 1);
      continue;
    }

    // trail
    if (r.trail.length > 1){
      ctx.beginPath();
      ctx.strokeStyle = `hsla(${r.hue}, 100%, 72%, .55)`;
      ctx.lineWidth = 2.6;
      ctx.moveTo(r.trail[0].x, r.trail[0].y);
      for (let k = 1; k < r.trail.length; k++) ctx.lineTo(r.trail[k].x, r.trail[k].y);
      ctx.stroke();
    }
    // head
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(r.x, r.y, 2.3, 0, 6.2832);
    ctx.fill();
  }
}

function updateSparks(dt){
  const drag = Math.pow(0.985, dt);
  for (let i = sparks.length - 1; i >= 0; i--){
    const p = sparks[i];
    p.vx *= drag;
    p.vy = p.vy * drag + 0.055 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;

    if (p.life <= 0){
      sparks.splice(i, 1);
      continue;
    }
    const a = p.life;
    ctx.fillStyle = `hsla(${p.hue}, 100%, ${(52 + a * 32) | 0}%, ${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.35 + a * 0.8), 0, 6.2832);
    ctx.fill();
  }
}

function updateConfetti(dt){
  for (let i = confetti.length - 1; i >= 0; i--){
    const c = confetti[i];
    c.vy += 0.17 * dt;
    c.vx *= Math.pow(0.99, dt);
    c.vy *= Math.pow(0.995, dt);
    c.sway += 0.06 * dt;
    c.x += (c.vx + Math.sin(c.sway) * 0.9) * dt;
    c.y += c.vy * dt;
    c.rot += c.vr * dt;

    if (c.y > H + 60){
      confetti.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.globalAlpha = 0.95;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------- Main loop ---------- */
let prevTime = performance.now();
function frame(now){
  const dt = Math.min((now - prevTime) / 16.667, 3);
  prevTime = now;

  // fade để tạo vệt sáng
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  updateRockets(dt);
  updateSparks(dt);

  ctx.globalCompositeOperation = 'source-over';
  updateConfetti(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Auto fireworks ---------- */
(function autoLaunch(){
  launchRocket();
  setTimeout(autoLaunch, 450 + Math.random() * 950);
})();

/* ---------- Click anywhere = nổ pháo hoa ---------- */
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  explode(e.clientX, e.clientY, Math.random() * 360);
  burstConfetti(e.clientX, e.clientY, 26);
});

/* =========================================================
   6. NHẠC "HAPPY BIRTHDAY" (Web Audio)
   ========================================================= */
let audioCtx = null;
let playing = false;

const NOTES = {
  G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25,
  F5: 698.46, G5: 783.99
};

const MELODY = [
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
  ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]
];

function playSong(){
  if (playing) return;
  playing = true;
  setTimeout(() => { playing = false; }, 11000);

  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const beat = 0.42;
  let t = audioCtx.currentTime + 0.1;

  MELODY.forEach(([note, dur]) => {
    const length = dur * beat;
    const osc = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc2.type = 'sine';
    osc.frequency.value = NOTES[note];
    osc2.frequency.value = NOTES[note] * 2;

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.20, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + length * 0.96);

    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(t);  osc.stop(t + length);
    osc2.start(t); osc2.stop(t + length);

    t += length;
  });
}
